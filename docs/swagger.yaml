basePath: /
definitions:
  common.AppError:
    properties:
      errorKey:
        type: string
      log:
        type: string
      message:
        type: string
      messageTrans:
        type: string
      statusCode:
        type: integer
    type: object
  common.RefDTO:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  common.SuccessRes:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      filter: {}
      message:
        example: success
        type: string
      paging: {}
    type: object
  dto.APIKeyDTO:
    properties:
      appId:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      id:
        type: string
      label:
        type: string
      lastUsedAt:
        type: string
      token:
        type: string
      tokenPreview:
        type: string
    type: object
  dto.AcceptInvitePayload:
    properties:
      name:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      token:
        maxLength: 128
        type: string
    required:
    - password
    - token
    type: object
  dto.AddTestersPayload:
    properties:
      emails:
        example:
        - qa1@company.com
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
    required:
    - emails
    type: object
  dto.AppBuildDTO:
    properties:
      appId:
        type: string
      buildNumber:
        type: string
      changelog:
        type: string
      iconUrl:
        type: string
      id:
        example: "9"
        type: string
      platform:
        allOf:
        - $ref: '#/definitions/sqlc.Platform'
        enum:
        - ios
        - android
      shareToken:
        type: string
      sizeBytes:
        type: integer
      status:
        example: ready
        type: string
      uploadedAt:
        type: string
      version:
        type: string
    type: object
  dto.AppBuildPage:
    properties:
      counts:
        $ref: '#/definitions/dto.PlatformCountsDTO'
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/dto.AppBuildDTO'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  dto.AppDTO:
    properties:
      autoAssignTesterGroups:
        type: boolean
      createdAt:
        type: string
      defaultTesterGroups:
        items:
          $ref: '#/definitions/common.RefDTO'
        type: array
      downloadLimit:
        type: integer
      expiresAt:
        type: string
      iconUrl:
        type: string
      id:
        type: string
      isPublic:
        type: boolean
      managingGroups:
        items:
          $ref: '#/definitions/common.RefDTO'
        type: array
      name:
        type: string
      platforms:
        $ref: '#/definitions/dto.PlatformsDTO'
      requiresApproval:
        type: boolean
    type: object
  dto.AppSummaryDTO:
    properties:
      iconUrl:
        type: string
      id:
        type: string
      name:
        type: string
      platforms:
        $ref: '#/definitions/dto.PlatformsDTO'
    type: object
  dto.ApprovalDTO:
    properties:
      appName:
        type: string
      buildId:
        example: ""
        type: string
      buildNumber:
        type: string
      id:
        type: string
      requestedAt:
        type: string
      requestedBy:
        type: string
      version:
        type: string
    type: object
  dto.ApprovalPayload:
    properties:
      requiresApproval:
        type: boolean
    required:
    - requiresApproval
    type: object
  dto.AutoAssignPayload:
    properties:
      autoAssignTesterGroups:
        type: boolean
    required:
    - autoAssignTesterGroups
    type: object
  dto.BuildDTO:
    properties:
      appId:
        type: string
      appName:
        description: Thông tin đọc từ file, ngoài tài liệu FE.
        type: string
      buildNumber:
        type: string
      bundleId:
        type: string
      changelog:
        type: string
      downloadCount:
        type: integer
      downloadUrl:
        type: string
      expiresAt:
        type: string
      iconUrl:
        type: string
      id:
        example: "42"
        type: string
      metadata:
        additionalProperties: {}
        type: object
      minOsVersion:
        type: string
      platform:
        allOf:
        - $ref: '#/definitions/sqlc.Platform'
        enum:
        - ios
        - android
      shareToken:
        type: string
      sizeBytes:
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/sqlc.BuildStatus'
        enum:
        - processing
        - ready
        - pending_approval
        - rejected
        - archived
      testerGroups:
        items:
          $ref: '#/definitions/common.RefDTO'
        type: array
      uploadedAt:
        type: string
      uploadedBy:
        type: string
      version:
        type: string
      warnings:
        items:
          type: string
        type: array
    type: object
  dto.ChangePasswordPayload:
    properties:
      currentPassword:
        maxLength: 72
        type: string
      newPassword:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  dto.CreateAPIKeyPayload:
    properties:
      label:
        example: GitHub Actions
        maxLength: 100
        type: string
    required:
    - label
    type: object
  dto.CreateAppPayload:
    properties:
      managingGroupIds:
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
      name:
        example: GMO Delivery
        maxLength: 100
        type: string
      platforms:
        $ref: '#/definitions/dto.PlatformsDTO'
    required:
    - managingGroupIds
    - name
    type: object
  dto.CreateBuildPayload:
    properties:
      appId:
        type: string
      changelog:
        example: Sửa lỗi đăng nhập
        maxLength: 2000
        type: string
      uploadKey:
        maxLength: 512
        type: string
    required:
    - appId
    - uploadKey
    type: object
  dto.CreateGroupPayload:
    properties:
      name:
        example: Mobile Team
        maxLength: 100
        type: string
      parentId:
        type: string
    required:
    - name
    type: object
  dto.CreateTesterGroupPayload:
    properties:
      name:
        example: Nhóm QA nội bộ
        maxLength: 100
        type: string
    required:
    - name
    type: object
  dto.CreateUserPayload:
    properties:
      email:
        example: dev1@company.com
        maxLength: 255
        type: string
      name:
        example: Dev One
        maxLength: 100
        type: string
      password:
        example: Dev@123456
        maxLength: 72
        minLength: 8
        type: string
      role:
        allOf:
        - $ref: '#/definitions/sqlc.UserRole'
        enum:
        - owner
        - admin
        - member
        - tester
    required:
    - email
    - name
    - password
    - role
    type: object
  dto.DailyDownloadsDTO:
    properties:
      count:
        example: 120
        type: integer
      date:
        example: "2026-09-25"
        type: string
    type: object
  dto.GroupDTO:
    properties:
      id:
        type: string
      members:
        items:
          $ref: '#/definitions/dto.MemberRefDTO'
        type: array
      name:
        type: string
      parentId:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/sqlc.EntityStatus'
        enum:
        - active
        - disabled
        - deleted
    type: object
  dto.InitUploadPayload:
    properties:
      fileName:
        example: app-release.apk
        maxLength: 255
        type: string
      fileSize:
        example: 45000000
        type: integer
    required:
    - fileName
    - fileSize
    type: object
  dto.InitUploadResponse:
    properties:
      expiresAt:
        type: string
      method:
        type: string
      uploadKey:
        type: string
      uploadUrl:
        type: string
    type: object
  dto.LoginPayload:
    properties:
      email:
        example: tester@appdist.local
        maxLength: 255
        type: string
      password:
        example: Test@e41ca7
        maxLength: 72
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      accessToken:
        type: string
      accessTokenExpiresAt:
        type: string
      refreshToken:
        type: string
      refreshTokenExpiresAt:
        type: string
      sessionId:
        type: string
      user:
        $ref: '#/definitions/dto.UserDTO'
    type: object
  dto.LogoutPayload:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dto.MemberRefDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/sqlc.UserRole'
        enum:
        - owner
        - admin
        - member
    type: object
  dto.PlatformCountsDTO:
    properties:
      all:
        type: integer
      android:
        type: integer
      ios:
        type: integer
    type: object
  dto.PlatformDTO:
    properties:
      bundleId:
        example: com.gmo.delivery.ios
        maxLength: 255
        type: string
    required:
    - bundleId
    type: object
  dto.PlatformsDTO:
    properties:
      android:
        $ref: '#/definitions/dto.PlatformDTO'
      ios:
        $ref: '#/definitions/dto.PlatformDTO'
    type: object
  dto.PublicAppDTO:
    properties:
      builds:
        $ref: '#/definitions/dto.AppBuildPage'
      iconUrl:
        type: string
      id:
        type: string
      name:
        type: string
      platforms:
        $ref: '#/definitions/dto.PlatformsDTO'
    type: object
  dto.ReleaseDTO:
    properties:
      appName:
        type: string
      buildNumber:
        type: string
      changelog:
        type: string
      expiresAt:
        type: string
      iconUrl:
        type: string
      installUrl:
        type: string
      pageUrl:
        description: |-
          Ngoài tài liệu FE: link trang tải bên FE (<FRONTEND_URL>/d/<token>) để
          chia sẻ / hiện QR; kèm vé nếu App không public.
        type: string
      platform:
        allOf:
        - $ref: '#/definitions/sqlc.Platform'
        enum:
        - ios
        - android
      requiresPassword:
        type: boolean
      sizeBytes:
        type: integer
      token:
        type: string
      uploadedAt:
        type: string
      version:
        type: string
    type: object
  dto.RenewAccessTokenPayload:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dto.RenewAccessTokenResponse:
    properties:
      accessToken:
        type: string
      accessTokenExpiresAt:
        type: string
    type: object
  dto.ReviewPayload:
    properties:
      decision:
        allOf:
        - $ref: '#/definitions/sqlc.ApprovalDecision'
        enum:
        - approve
        - reject
      note:
        maxLength: 2000
        type: string
    required:
    - decision
    type: object
  dto.ReviewResultDTO:
    properties:
      buildId:
        example: ""
        type: string
      decision:
        allOf:
        - $ref: '#/definitions/sqlc.ApprovalDecision'
        enum:
        - approve
        - reject
      id:
        type: string
      note:
        type: string
      reviewedAt:
        type: string
      reviewedBy:
        type: string
    type: object
  dto.SummaryDTO:
    properties:
      totalApps:
        type: integer
      totalBuilds:
        type: integer
      totalDownloads:
        type: integer
      totalTesters:
        type: integer
    type: object
  dto.TesterDTO:
    properties:
      email:
        type: string
      id:
        type: string
      inviteUrl:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/sqlc.EntityStatus'
        enum:
        - active
        - disabled
        - deleted
    type: object
  dto.TesterGroupDTO:
    properties:
      id:
        type: string
      memberCount:
        type: integer
      name:
        type: string
    type: object
  dto.UpdateAppInfoPayload:
    properties:
      name:
        example: GMO Delivery
        maxLength: 100
        type: string
      platforms:
        $ref: '#/definitions/dto.PlatformsDTO'
    required:
    - name
    type: object
  dto.UpdateRolePayload:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/sqlc.UserRole'
        enum:
        - owner
        - admin
        - member
        - tester
    required:
    - role
    type: object
  dto.UpdateStatusPayload:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/sqlc.EntityStatus'
        enum:
        - active
        - disabled
    required:
    - status
    type: object
  dto.UploadContentResult:
    properties:
      uploadKey:
        type: string
      uploaded:
        example: true
        type: boolean
    type: object
  dto.UserDTO:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/sqlc.UserRole'
        enum:
        - owner
        - admin
        - member
        - tester
      status:
        allOf:
        - $ref: '#/definitions/sqlc.EntityStatus'
        enum:
        - active
        - disabled
        - deleted
    type: object
  dto.UserGroupDTO:
    properties:
      id:
        type: string
      name:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/sqlc.EntityStatus'
        enum:
        - active
        - disabled
    type: object
  dto.VisibilityPayload:
    properties:
      downloadLimit:
        example: 500
        minimum: 1
        type: integer
      expiresAt:
        type: string
      isPublic:
        type: boolean
    required:
    - isPublic
    type: object
  handler.AppPage:
    properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/dto.AppDTO'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  handler.BuildPage:
    properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/dto.BuildDTO'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  handler.MyAppPage:
    properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/dto.AppSummaryDTO'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  handler.SuccessResult:
    properties:
      success:
        example: true
        type: boolean
    type: object
  handler.UserPage:
    properties:
      hasMore:
        type: boolean
      items:
        items:
          $ref: '#/definitions/dto.UserDTO'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  sqlc.ApprovalDecision:
    enum:
    - approve
    - reject
    type: string
    x-enum-varnames:
    - ApprovalDecisionApprove
    - ApprovalDecisionReject
  sqlc.BuildStatus:
    enum:
    - processing
    - ready
    - pending_approval
    - rejected
    - archived
    type: string
    x-enum-varnames:
    - BuildStatusProcessing
    - BuildStatusReady
    - BuildStatusPendingApproval
    - BuildStatusRejected
    - BuildStatusArchived
  sqlc.EntityStatus:
    enum:
    - active
    - disabled
    - deleted
    type: string
    x-enum-varnames:
    - EntityStatusActive
    - EntityStatusDisabled
    - EntityStatusDeleted
  sqlc.Platform:
    enum:
    - ios
    - android
    type: string
    x-enum-varnames:
    - PlatformIos
    - PlatformAndroid
  sqlc.UserRole:
    enum:
    - admin
    - member
    - owner
    - tester
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleMember
    - UserRoleOwner
    - UserRoleTester
info:
  contact: {}
  description: |-
    Lưu file cài đặt (IPA/APK) và tạo link tải cho khách.
    Mọi response JSON thành công bọc trong common.SuccessRes; lỗi trả common.AppError.

    **Tài khoản test** (body mẫu của POST /api/v1/auth/login đã điền sẵn):

    | Email    | tester@appdist.local |
    | -------- | -------------------- |
    | Mật khẩu | Test@e41ca7          |
  title: AppDist API
  version: "1.0"
paths:
  /api/v1/approvals:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.SuccessRes'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ApprovalDTO'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.AppError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.AppError'
      security:
      - BearerAuth: []
      summary: Yêu cầu duyệt build đang chờ (owner/admin, trong scope)
      tags:
      - approvals
  /api/v1/approvals/{id}/review:
    post:
      consumes:
      - application/json
      description: approve → build ready; reject → build rejected. Đã duyệt rồi →
        409.
      parameters:
      - description: Approval request ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Quyết định và ghi chú
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ReviewPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.SuccessRes'
            - properties:
                data:
                  $ref: '#/definitions/dto.ReviewResultDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.AppError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.AppError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/common.AppError'
      security:
      - BearerAuth: []
      summary: Duyệt hoặc từ chối build (owner/admin, trong scope)
      tags:
      - approvals
  /api/v1/apps:
    get:
      description: owner thấy tất cả; role khác chỉ thấy App thuộc nhóm quản trị của
        mình.
      parameters:
      - description: Lọc theo tên
        in: query
        name: search
        type: string
      - description: ios | android
        enum:
        - ios
        - android
        in: query
        name: platform
        type: string
      - description: createdAt >= (RFC3339)
        format: date-time
        in: query
        name: from
        type: string
      - description: createdAt <= (RFC3339)
        format: date-time
        in: query
        name: to
        type: string
      - description: Mặc định 1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Mặc định 20
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.SuccessRes'
            - properties:
                data:
                  $ref: '#/definitions/handler.AppPage'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.AppError'
      security:
      - BearerAuth: []
      summary: Danh sách App (phân trang)
      tags:
      - apps
    post:
      consumes:
      - application/json
      description: Cần ít nhất một platform và một nhóm quản trị. Admin chỉ gán được
        nhóm mình là thành viên.
      parameters:
      - description: Tên, platforms, nhóm quản trị
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAppPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/common.SuccessRes'
            - properties:
                data:
                  $ref: '#/definitions/dto.AppDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.AppError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.AppError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/common.AppError'
      security:
      - BearerAuth: []
      summary: Tạo App (owner/admin)
      tags:
      - apps
  /api/v1/apps/{id}:
    get:
      parameters:
      - description: App ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.SuccessRes'
            - properties:
                data:
                  $ref: '#/definitions/dto.AppDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.AppError'
      security:
      - BearerAuth: []
      summary: Chi tiết App (ngoài scope → 404)
      tags:
      - apps
  /api/v1/apps/{id}/approval:
    patch:
      consumes:
      - application/json
      description: Bật → build mới có status pending_approval và một yêu cầu duyệt
        ở GET /approvals.
      parameters:
      - description: App ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: requiresApproval
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ApprovalPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.SuccessRes'
            - properties:
                data:
